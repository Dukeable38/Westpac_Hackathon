<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar – opening animation</title>
<style>
  :root{--bg:#FFFFFF;--ink:#1F1C4F;--accent:#DA1710;--sw:15px}
  body.dark{--bg:#1F1C4F;--ink:#FFFFFF}
  html,body{height:100%;margin:0}
  body{background:var(--bg);display:grid;place-items:center;font-family:Arial,sans-serif;transition:background .3s}
  svg.logo{width:min(86vw,420px);height:auto;color:var(--ink);overflow:visible}

  /* 1. The invoice rises in with the red dot already there (0.1s to 0.7s) */
  .doc{fill:var(--ink);transform-origin:150px 262px;opacity:0;transform:translateY(14px) scale(.94);
        animation:rise .5s cubic-bezier(.2,.8,.3,1) .05s forwards}
  .dot{fill:var(--accent);transform-origin:228px 44px;transform:scale(0);
        animation:pop .35s cubic-bezier(.3,1.8,.6,1) .25s forwards, beat .2s ease-in-out .55s 2, beat .28s ease-in-out 1.15s 1}
  /* 2. Double pulse: two quick shots 0.2s apart, each sending a red sonar line across the invoice (0.55s to 1.6s) */
  .ripple{fill:none;stroke:var(--accent);stroke-width:3;vector-effect:non-scaling-stroke;transform-origin:228px 44px;opacity:0;
           animation:ripple .6s ease-out forwards}
  .wave{fill:none;stroke:var(--accent);stroke-width:var(--sw);stroke-linecap:round;vector-effect:non-scaling-stroke;transform-origin:228px 44px;
         transform:scale(15);opacity:0;animation:scan .85s linear forwards}
  .p1{animation-delay:.55s} .p2{animation-delay:.75s}
  /* 3. A beat later the last wave comes out of the dot and stops in place: the logo (1.15s) */
  .arc{fill:none;stroke:var(--accent);stroke-width:var(--sw);stroke-linecap:round;vector-effect:non-scaling-stroke;
        transform-origin:228px 44px;transform:scale(.3);opacity:0;animation:emerge .55s cubic-bezier(.2,.8,.3,1) 1.15s forwards}
  /* 4. Name and tagline come in with that last wave (1.15s) */
  .word{opacity:0;transform:translateY(12px);animation:fade .45s ease-out 1.15s forwards}
  .tag{opacity:0;transform:translateY(12px);animation:fade .45s ease-out 1.15s forwards}

  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes pop{to{transform:scale(1)}}
  @keyframes beat{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}
  @keyframes double{0%,40%,100%{transform:scale(1)}10%,30%{transform:scale(1.35)}20%{transform:scale(1.05)}}
  @keyframes ripple{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
  @keyframes scan{0%{transform:scale(15);opacity:0}6%{opacity:1}85%{opacity:.9}100%{transform:scale(285);opacity:0}}
  @keyframes emerge{0%{transform:scale(.3);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes fade{to{opacity:1;transform:none}}

  /* Scanning mode (loading screen while an invoice is checked): add class="scanning" to the svg.
     The dot keeps pulsing and sending sonar across the invoice until you remove the class. */
  svg.scanning .dot{animation:double 1s ease-in-out infinite}
  svg.scanning .ripple{animation:ripple 1s ease-out infinite}
  svg.scanning .wave{animation:scan 1s linear infinite}
  svg.scanning .p2{animation-delay:.2s}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}
    .doc,.word,.tag,.arc{opacity:1;transform:none}.dot{transform:none}.wave,.ripple{opacity:0}}

  .controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  .controls button{font:600 13px Arial,sans-serif;color:var(--ink);background:transparent;border:1.5px solid var(--ink);
                    border-radius:999px;padding:8px 16px;cursor:pointer;opacity:.7}
  .controls button:hover{opacity:1}
</style></head>

  <button type="button" onclick="replay()">Replay</button>
  <button type="button" onclick="document.body.classList.toggle('dark')">Light / dark</button>
</div>
<script>
  // Keep the sonar lines exactly as thick as the logo's red wave at any screen size
  function setStroke(){const svg=document.querySelector('svg.logo');
    const k=svg.getBoundingClientRect().width/600*1.35;
    document.documentElement.style.setProperty('--sw',(16*k)+'px');}
  function replay(){const s=document.getElementById('stage');s.replaceWith(s.cloneNode(true));setStroke();}
  window.addEventListener('resize',setStroke); setStroke();
</script>
